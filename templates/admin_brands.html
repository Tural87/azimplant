{% extends "admin_base.html" %}
{% block content %}
<section class="admin-section">
  <h1>Brendlər</h1>
  <form class="admin-form" method="post" enctype="multipart/form-data">
    <input type="hidden" name="id" value="{{ edit.id if edit else '' }}">
    <input type="hidden" name="current_logo" value="{{ edit.logo if edit else '' }}">
    <div class="form-grid">
      <label>Ad<input name="name" required value="{{ edit.name if edit else '' }}"></label>
      <label>Link<input name="url" value="{{ edit.url if edit else '' }}"></label>
      <label>Sıra<input name="sort_order" type="number" value="{{ edit.sort_order if edit else 0 }}"></label>
    </div>
    <div class="form-grid">
      <label>Təsvir AZ<textarea name="description_az" rows="5">{{ edit.description_az if edit else '' }}</textarea></label>
      <label>Təsvir EN<textarea name="description_en" rows="5">{{ edit.description_en if edit else '' }}</textarea></label>
    </div>
    <label>Logo<input type="file" name="logo" accept="image/*"></label>
    <label class="check"><input type="checkbox" name="is_active" {% if not edit or edit.is_active %}checked{% endif %}> Aktiv</label>
    <button type="submit">{{ 'Yenilə' if edit else 'Əlavə et' }}</button>
  </form>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Sıra</th><th>Ad</th><th>Link</th><th>Status</th><th></th></tr></thead>
      <tbody>
        {% for row in rows %}
          <tr><td>{{ row.sort_order }}</td><td>{{ row.name }}</td><td>{{ row.url }}</td><td>{{ 'Aktiv' if row.is_active else 'Passiv' }}</td><td><a href="{{ url_for('admin_brands', edit=row.id) }}">Düzəlt</a></td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
