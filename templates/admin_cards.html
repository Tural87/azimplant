{% extends "admin_base.html" %}
{% block content %}
<section class="admin-section">
  <h1>Fəaliyyət və üstünlük kartları</h1>
  <form class="admin-form" method="post">
    <input type="hidden" name="id" value="{{ edit.id if edit else '' }}">
    <div class="form-grid">
      <label>Qrup
        <select name="group_key">
          <option value="services" {% if edit and edit.group_key == 'services' %}selected{% endif %}>Fəaliyyət</option>
          <option value="why" {% if edit and edit.group_key == 'why' %}selected{% endif %}>Niyə biz</option>
        </select>
      </label>
      <label>Icon adı<input name="icon" value="{{ edit.icon if edit else 'sparkles' }}"></label>
      <label>Sıra<input name="sort_order" type="number" value="{{ edit.sort_order if edit else 0 }}"></label>
    </div>
    <div class="form-grid">
      <label>Başlıq AZ<input name="title_az" required value="{{ edit.title_az if edit else '' }}"></label>
      <label>Başlıq EN<input name="title_en" required value="{{ edit.title_en if edit else '' }}"></label>
    </div>
    <div class="form-grid">
      <label>Mətn AZ<textarea name="body_az" rows="5">{{ edit.body_az if edit else '' }}</textarea></label>
      <label>Mətn EN<textarea name="body_en" rows="5">{{ edit.body_en if edit else '' }}</textarea></label>
    </div>
    <label class="check"><input type="checkbox" name="is_active" {% if not edit or edit.is_active %}checked{% endif %}> Aktiv</label>
    <button type="submit">{{ 'Yenilə' if edit else 'Əlavə et' }}</button>
  </form>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Qrup</th><th>Sıra</th><th>Icon</th><th>AZ</th><th>Status</th><th></th></tr></thead>
      <tbody>
        {% for row in rows %}
          <tr><td>{{ row.group_key }}</td><td>{{ row.sort_order }}</td><td>{{ row.icon }}</td><td>{{ row.title_az }}</td><td>{{ 'Aktiv' if row.is_active else 'Passiv' }}</td><td><a href="{{ url_for('admin_cards', edit=row.id) }}">Düzəlt</a></td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
