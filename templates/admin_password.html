{% extends "admin_base.html" %}
{% block content %}
<section class="admin-section narrow">
  <h1>Parolu dəyiş</h1>
  <form class="admin-form" method="post">
    <label>Cari parol<input type="password" name="current_password" required></label>
    <label>Yeni parol<input type="password" name="new_password" required></label>
    <label>Yeni parol təkrar<input type="password" name="confirm_password" required></label>
    <button type="submit">Parolu yenilə</button>
  </form>
</section>
{% endblock %}
