{% extends "admin_base.html" %}
{% block content %}
<section class="admin-section">
  <h1>Bölmələr</h1>
  <form class="admin-form" method="post" enctype="multipart/form-data">
    <input type="hidden" name="id" value="{{ edit.id if edit else '' }}">
    <input type="hidden" name="current_image" value="{{ edit.image if edit else '' }}">
    <div class="form-grid">
      <label>Slug<input name="slug" required value="{{ edit.slug if edit else '' }}" placeholder="hero"></label>
      <label>Sıra<input name="sort_order" type="number" value="{{ edit.sort_order if edit else 0 }}"></label>
    </div>
    <div class="form-grid">
      <label>Başlıq AZ<input name="title_az" required value="{{ edit.title_az if edit else '' }}"></label>
      <label>Başlıq EN<input name="title_en" required value="{{ edit.title_en if edit else '' }}"></label>
    </div>
    <div class="form-grid">
      <label>Alt mətn AZ<input name="subtitle_az" value="{{ edit.subtitle_az if edit else '' }}"></label>
      <label>Alt mətn EN<input name="subtitle_en" value="{{ edit.subtitle_en if edit else '' }}"></label>
    </div>
    <div class="form-grid">
      <label>Mətn AZ<textarea name="body_az" rows="7">{{ edit.body_az if edit else '' }}</textarea></label>
      <label>Mətn EN<textarea name="body_en" rows="7">{{ edit.body_en if edit else '' }}</textarea></label>
    </div>
    <label>Şəkil<input type="file" name="image" accept="image/*"></label>
    <label class="check"><input type="checkbox" name="is_active" {% if not edit or edit.is_active %}checked{% endif %}> Aktiv</label>
    <button type="submit">{{ 'Yenilə' if edit else 'Əlavə et' }}</button>
  </form>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Sıra</th><th>Slug</th><th>AZ</th><th>EN</th><th>Status</th><th></th></tr></thead>
      <tbody>
        {% for row in rows %}
          <tr>
            <td>{{ row.sort_order }}</td><td>{{ row.slug }}</td><td>{{ row.title_az }}</td><td>{{ row.title_en }}</td>
            <td>{{ 'Aktiv' if row.is_active else 'Passiv' }}</td>
            <td><a href="{{ url_for('admin_sections', edit=row.id) }}">Düzəlt</a></td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
