{% extends "admin_base.html" %}
{% block content %}
<section class="admin-section">
  <h1>İstifadəçilər</h1>
  <form class="admin-form" method="post">
    <div class="form-grid">
      <label>Login<input name="username" required></label>
      <label>Parol<input name="password" required></label>
      <label>Rol
        <select name="role">
          <option value="editor">Editor</option>
          <option value="superadmin">Superadmin</option>
        </select>
      </label>
    </div>
    <button type="submit">Yarat</button>
  </form>
  <div class="table-wrap">
    <table>
      <thead><tr><th>ID</th><th>Login</th><th>Rol</th></tr></thead>
      <tbody>
        {% for row in rows %}
          <tr><td>{{ row.id }}</td><td>{{ row.username }}</td><td>{{ row.role }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
